<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Check your email – Linkhaven</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{opacity:.8}
.glass{background:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.95);box-shadow:0 20px 50px rgba(10,61,31,0.12);backdrop-filter:blur(14px)}
.chev{display:flex}
@media (max-width:820px){.chev{display:none}}
@media (max-width:700px){.nl{display:none}.navpill{padding-left:16px !important;gap:16px !important}}
@media (max-width:560px){.claim{flex-wrap:wrap !important;border-radius:28px !important;padding:14px !important}.claim button{width:100%;justify-content:center}.claim>svg{display:none}.stepspanel{padding:28px 22px !important}}
</style>
</head>
<body>
<div style="position: relative; overflow: hidden; width: 100%; color: #07281A; font-family: 'Figtree', sans-serif; font-size: 17px; line-height: 1.5; background: radial-gradient(1000px 650px at 85% 6%, #DDF7AE 0%, rgba(221,247,174,0) 60%), radial-gradient(800px 600px at 0% 20%, #E4F1D6 0%, rgba(228,241,214,0) 60%), #F1F6E6"><div aria-hidden="true" style="position: absolute; top: -320px; right: -260px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle at 30% 70%, #1C7A3A, #07281A 70%); box-shadow: 0 0 0 10px rgba(178,241,27,0.35)"></div><div aria-hidden="true" style="position: absolute; bottom: -360px; left: -260px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle at 70% 30%, #1C7A3A, #07281A 70%); box-shadow: 0 0 0 8px rgba(178,241,27,0.4)"></div><div style="position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-direction: column; gap: 56px"><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; min-height: 760px"><a href="#" style="display: flex; align-items: center; gap: 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em"><svg width="42" height="42" viewBox="0 0 52 52" aria-hidden="true"><path d="M26 2l21 12v24L26 50 5 38V14z" fill="#07281A" stroke="#1C7A3A" stroke-width="2" stroke-linejoin="round"/><path d="M16 27l10-9 10 9M19 25v9h14v-9" stroke="#B2F11B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Linkhaven</a><div style="width: 100%; max-width: 460px"><div style="background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 20px 50px rgba(10,61,31,0.12); backdrop-filter: blur(14px); border-radius: 32px; padding: 32px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center"><div style="width: 84px; height: 84px; border-radius: 26px; background: linear-gradient(145deg, #E3FF6A, #A7E61C); box-shadow: 0 14px 30px rgba(155,226,26,0.5), inset 0 2px 0 rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#07281A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Check your email</h2><p style="margin: 0; color: #3B5A45">We sent a link to <b style="color: #07281A">you@email.com</b>. Open it to finish setting up your page.</p><button style="width: 100%; border: 2px solid #07281A; background: transparent; padding: 14px 28px; border-radius: 999px; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; color: #07281A">Resend email</button><p style="margin: 0; font-size: 15px">Wrong address? <a href="#" style="color: #1E7A32; font-weight: 600; text-decoration: underline">Go back</a></p></div></div></div><div style="display: flex; gap: 24px; flex-wrap: wrap; justify-content: center"><a href="#" style="color: #1E7A32; font-weight: 600; text-decoration: underline">Back to home</a></div></div></div></div>
<script>
// Linkhaven prototype wiring (no backend yet). Phase 2 replaces this with real sign-up, login and saving.
(function () {
  var links = {
    'Log in': 'login.html', 'Sign up free': 'signup.html', 'Claim your handle': 'signup.html',
    'Claim this handle': 'signup.html', 'Join Linkhaven Today': 'signup.html', 'Get Started': 'signup.html',
    'Forgot password?': 'forgot-password.html', 'Forgot password': 'forgot-password.html',
    'Check your email': 'check-email.html', 'Back to log in': 'login.html', 'Go back': 'signup.html',
    'Back to home': 'index.html', 'Go to home page': 'index.html', 'Go to my dashboard': 'dashboard.html',
    'Linkhaven': 'index.html',
    'Terms': 'legal.html#terms', 'Privacy': 'legal.html#privacy', 'Privacy Policy': 'legal.html#privacy',
    'Acceptable use': 'legal.html#acceptable-use', 'Report abuse': 'legal.html#report',
    'Links': 'dashboard.html', 'Appearance': 'appearance.html', 'Analytics': 'analytics.html', 'Settings': 'settings.html'
  };
  document.querySelectorAll('a').forEach(function (a) {
    var t = a.textContent.trim();
    if (links[t]) a.setAttribute('href', links[t]);
  });
  var buttons = { 'Create my page': 'check-email.html', 'Log in': 'dashboard.html', 'Send reset link': 'check-email.html', 'Finish and see my page': 'onboarding.html' };
  document.querySelectorAll('button').forEach(function (b) {
    var t = b.textContent.trim();
    if (buttons[t]) b.addEventListener('click', function () { location.href = buttons[t]; });
  });
  var claim = document.querySelector('.claim');
  if (claim) {
    var go = function () {
      var v = (document.getElementById('handle') || {}).value || '';
      location.href = 'signup.html' + (v ? '?handle=' + encodeURIComponent(v.trim()) : '');
    };
    var btn = claim.querySelector('button');
    if (btn) btn.addEventListener('click', go);
    var inp = document.getElementById('handle');
    if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }
  var h = new URLSearchParams(location.search).get('handle');
  var sh = document.getElementById('sh');
  if (h && sh) sh.value = h;
})();
</script>
</body>
</html>
