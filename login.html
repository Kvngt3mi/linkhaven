<div style="position: relative; overflow: hidden; width: 100%; color: #07281A; font-family: 'Figtree', sans-serif; font-size: 17px; line-height: 1.5; background: radial-gradient(1000px 650px at 85% 6%, #DDF7AE 0%, rgba(221,247,174,0) 60%), radial-gradient(800px 600px at 0% 20%, #E4F1D6 0%, rgba(228,241,214,0) 60%), #F1F6E6"><div aria-hidden="true" style="position: absolute; top: -320px; right: -260px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle at 30% 70%, #1C7A3A, #07281A 70%); box-shadow: 0 0 0 10px rgba(178,241,27,0.35)"></div><div aria-hidden="true" style="position: absolute; bottom: -360px; left: -260px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle at 70% 30%, #1C7A3A, #07281A 70%); box-shadow: 0 0 0 8px rgba(178,241,27,0.4)"></div><div style="position: relative; z-index: 1; max-width: 1360px; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-direction: column; gap: 56px"><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; min-height: 800px"><a href="#" style="display: flex; align-items: center; gap: 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em"><svg width="42" height="42" viewBox="0 0 52 52" aria-hidden="true"><path d="M26 2l21 12v24L26 50 5 38V14z" fill="#07281A" stroke="#1C7A3A" stroke-width="2" stroke-linejoin="round"/><path d="M16 27l10-9 10 9M19 25v9h14v-9" stroke="#B2F11B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Linkhaven</a><div style="width: 100%; max-width: 460px"><div style="background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 20px 50px rgba(10,61,31,0.12); backdrop-filter: blur(14px); border-radius: 32px; padding: 32px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><div><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em; line-height: 1.15">Welcome back</h2><p style="margin: 6px 0 0; color: #3B5A45">Log in to manage your links.</p></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="le" style="font-size: 15px; font-weight: 600">Email</label><input id="le" type="email" placeholder="you@email.com" value="" style="width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.9); border: 1px solid #C3D6C7; border-radius: 16px; padding: 15px 18px; font-family: inherit; font-size: 17px; color: #07281A; outline: 0"></div><div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; align-items: baseline"><label for="lp" style="font-size: 15px; font-weight: 600">Password</label><a href="#" style="color: #1E7A32; font-weight: 600; font-size: 14px; text-decoration: underline">Forgot password?</a></div><div style="position: relative"><input id="lp" type="password" placeholder="At least 8 characters" style="width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.9); border: 1px solid #C3D6C7; border-radius: 16px; padding: 15px 18px; font-family: inherit; font-size: 17px; color: #07281A; outline: 0; padding-right: 76px"><button style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; color: #1E7A32; padding: 8px 12px">Show</button></div></div><button style="border: 0; cursor: pointer; width: 100%; background: linear-gradient(180deg, #D4FF4A, #9BE21A); box-shadow: 0 0 0 2px #7CCB12, 0 10px 26px rgba(155,226,26,0.5); padding: 16px 28px; border-radius: 999px; font-family: inherit; font-size: 18px; font-weight: 600; color: #07281A">Log in</button><div style="display: flex; align-items: center; gap: 14px; color: #5E7A66; font-size: 14px"><span style="flex: 1; height: 1px; background: #C3D6C7"></span>or<span style="flex: 1; height: 1px; background: #C3D6C7"></span></div><button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; background: #FFFFFF; border: 1px solid #C3D6C7; padding: 14px 28px; border-radius: 999px; font-family: inherit; font-size: 17px; font-weight: 600; color: #07281A"><span style="width: 24px; height: 24px; border-radius: 50%; background: #07281A; color: #F2F5EE; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">G</span>Continue with Google</button><p style="margin: 0; text-align: center">New here? <a href="#" style="color: #1E7A32; font-weight: 600; text-decoration: underline">Claim your handle</a></p></div></div><div style="display: flex; gap: 24px; flex-wrap: wrap; justify-content: center"><a href="#" style="color: #1E7A32; font-weight: 600; text-decoration: underline">Back to home</a></div></div></div></div>
<script>
// Linkhaven core: talks to Supabase using plain fetch. The key below is the public (publishable) key.
(function () {
  var LH = window.LH = {};
  LH.url = 'https://vjpnaxulswqrogjlknls.supabase.co';
  LH.key = 'sb_publishable_hR7ZtlFR__pr7HOODN-blQ_XLYB0Cr0';
  var SKEY = 'lh_session';

  LH.$ = function (id) { return document.getElementById(id); };
  LH.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  LH.btn = function (text) {
    return [].slice.call(document.querySelectorAll('button,a')).filter(function (b) { return b.textContent.trim() === text; })[0] || null;
  };
  LH.leaf = function (text) {
    return [].slice.call(document.querySelectorAll('div,span,b')).filter(function (d) { return d.children.length === 0 && d.textContent.trim() === text; });
  };
  LH.replaceText = function (root, from, to) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) { if (n.nodeValue.indexOf(from) > -1) n.nodeValue = n.nodeValue.split(from).join(to); }
  };

  // ---- session ----
  LH.session = function () { try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { return null; } };
  LH.save = function (s) {
    if (!s) { localStorage.removeItem(SKEY); return; }
    var exp = s.expires_at || (s.expires_in ? Math.floor(Date.now() / 1000) + s.expires_in : 0);
    localStorage.setItem(SKEY, JSON.stringify({
      access_token: s.access_token, refresh_token: s.refresh_token, expires_at: exp,
      user: s.user ? { id: s.user.id, email: s.user.email } : (LH.session() || {}).user
    }));
  };

  // ---- errors ----
  LH.msg = function (j) { return (j && (j.msg || j.error_description || j.message || j.error)) || ''; };
  LH.friendly = function (e) {
    var m = ((e && e.message) || '').toLowerCase();
    if (m.indexOf('already registered') > -1 || m.indexOf('already exists') > -1) return 'That email already has an account. Try logging in.';
    if (m.indexOf('invalid login') > -1) return 'Wrong email or password.';
    if (m.indexOf('not confirmed') > -1) return 'Please confirm your email first. Check your inbox.';
    if (m.indexOf('password') > -1 && m.indexOf('at least') > -1) return 'Use at least 8 characters for your password.';
    if (m.indexOf('database error') > -1) return 'That handle may have just been taken. Try another one.';
    if (m.indexOf('rate limit') > -1 || (e && e.status === 429)) return 'Too many attempts. Please wait a few minutes and try again.';
    if (m.indexOf('failed to fetch') > -1 || m.indexOf('network') > -1) return 'No connection. Check your internet and try again.';
    return (e && e.message) || 'Something went wrong. Please try again.';
  };
  LH.showErr = function (before, text, good) {
    var d = before.previousElementSibling;
    if (!d || !d.classList || !d.classList.contains('lh-msg')) {
      d = document.createElement('div'); d.className = 'lh-msg';
      d.style.cssText = 'font-size:15px;font-weight:600;line-height:1.4';
      before.parentNode.insertBefore(d, before);
    }
    d.style.color = good ? '#1E7A32' : '#C23A22';
    d.textContent = text || '';
    d.style.display = text ? 'block' : 'none';
  };

  // ---- network ----
  LH.headers = function (token, extra) {
    var h = { 'apikey': LH.key, 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    for (var k in (extra || {})) h[k] = extra[k];
    return h;
  };
  function jfetch(path, opts) {
    return fetch(LH.url + path, opts).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) { var err = new Error(LH.msg(j) || ('Request failed (' + r.status + ')')); err.status = r.status; err.body = j; throw err; }
        return { body: j, res: r };
      });
    });
  }
  LH.token = function () {
    var s = LH.session();
    if (!s) return Promise.resolve(null);
    if (s.expires_at && s.expires_at - 60 > Math.floor(Date.now() / 1000)) return Promise.resolve(s.access_token);
    return jfetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ refresh_token: s.refresh_token }) })
      .then(function (r) { LH.save(r.body); return r.body.access_token; })
      .catch(function () { LH.save(null); return null; });
  };
  // method, path (after /rest/v1/), JSON body, optional Prefer header
  LH.rest = function (method, path, body, prefer) {
    return LH.token().then(function (t) {
      return jfetch('/rest/v1/' + path, { method: method, headers: LH.headers(t, prefer ? { Prefer: prefer } : null), body: body === undefined ? undefined : JSON.stringify(body) });
    }).then(function (r) { return r.body; });
  };
  LH.count = function (path) {
    return LH.token().then(function (t) {
      return fetch(LH.url + '/rest/v1/' + path, { headers: LH.headers(t, { Prefer: 'count=exact', Range: '0-0' }) }).then(function (r) {
        var n = parseInt((r.headers.get('content-range') || '').split('/')[1], 10);
        return isNaN(n) ? 0 : n;
      });
    });
  };

  // ---- auth ----
  LH.signUp = function (email, pw, handle) {
    return jfetch('/auth/v1/signup', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ email: email, password: pw, data: { handle: handle } }) })
      .then(function (r) { if (r.body && r.body.access_token) { LH.save(r.body); return { session: true }; } return { session: false }; });
  };
  LH.signIn = function (email, pw) {
    return jfetch('/auth/v1/token?grant_type=password', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ email: email, password: pw }) })
      .then(function (r) { LH.save(r.body); return r.body; });
  };
  LH.signOut = function () {
    return LH.token().then(function (t) {
      LH.save(null);
      if (!t) return;
      return fetch(LH.url + '/auth/v1/logout', { method: 'POST', headers: LH.headers(t) }).catch(function () {});
    });
  };
  LH.recover = function (email) { return jfetch('/auth/v1/recover', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ email: email }) }); };
  LH.resend = function (email) { return jfetch('/auth/v1/resend', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ type: 'signup', email: email }) }); };
  LH.setPassword = function (token, pw) { return jfetch('/auth/v1/user', { method: 'PUT', headers: LH.headers(token), body: JSON.stringify({ password: pw }) }); };

  // ---- storage ----
  LH.uploadAvatar = function (blob, uid) {
    return LH.token().then(function (t) {
      var path = uid + '/avatar.jpg';
      return fetch(LH.url + '/storage/v1/object/avatars/' + path, { method: 'POST', headers: { apikey: LH.key, Authorization: 'Bearer ' + t, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: blob })
        .then(function (r) { if (!r.ok) throw new Error('Photo upload failed. Try a smaller picture.'); return LH.url + '/storage/v1/object/public/avatars/' + path + '?v=' + Date.now(); });
    });
  };
  LH.resize = function (file, max) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { URL.revokeObjectURL(u); b ? resolve(b) : reject(new Error('Could not read that picture.')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { reject(new Error('Could not read that picture.')); };
      img.src = u;
    });
  };

  // ---- helpers ----
  LH.reserved = ['admin','api','app','auth','dashboard','login','logout','signup','settings','appearance','analytics','legal','terms','privacy','report','support','help','about','pricing','feedback','assets','static','www','linkhaven','index','onboarding','forgot-password','check-email','profile'];
  LH.checkHandle = function (v) {
    if (!/^[a-z0-9_.]{3,30}$/.test(v)) return 'Use 3 to 30 letters, numbers, dots or underscores.';
    if (LH.reserved.indexOf(v) > -1) return 'That name is reserved. Try another one.';
    return '';
  };
  LH.normUrl = function (u) {
    u = (u || '').trim();
    if (!u) return '';
    if (!/^(https?:\/\/|mailto:|tel:)/i.test(u)) u = (u.indexOf('@') > 0 && !/[\/\s]/.test(u)) ? 'mailto:' + u : 'https://' + u;
    if (/^https?:/i.test(u)) { try { new URL(u); } catch (e) { return ''; } }
    return u.length > 2000 ? '' : u;
  };
  LH.device = function () {
    var ua = navigator.userAgent || '';
    if (/iPad|Tablet/i.test(ua)) return 'tablet';
    if (/Mobi|Android|iPhone/i.test(ua)) return 'mobile';
    return ua ? 'desktop' : 'unknown';
  };
  LH.pageUrl = function (handle) { return location.origin + '/u.html?h=' + encodeURIComponent(handle); };
  LH.copy = function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove();
    return Promise.resolve();
  };
  // Show / Hide buttons next to password fields
  document.querySelectorAll('button').forEach(function (b) {
    if (b.textContent.trim() === 'Show') b.addEventListener('click', function () {
      var i = b.parentElement.querySelector('input'); if (!i) return;
      var show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
    });
  });
  // Password reset links land on the home page with a token in the address: forward them
  if (/type=recovery/.test(location.hash) && !/reset-password/.test(location.pathname)) location.replace('reset-password.html' + location.hash);
})();
</script>
<script>
// Linkhaven page wiring: nav links, claim box, sample-data banner.
(function () {
  var links = {
    'Log in': 'login.html', 'Sign up free': 'signup.html', 'Claim your handle': 'signup.html',
    'Claim this handle': 'signup.html', 'Join Linkhaven Today': 'signup.html', 'Get Started': 'signup.html',
    'Forgot password?': 'forgot-password.html', 'Forgot password': 'forgot-password.html',
    'Check your email': 'check-email.html', 'Back to log in': 'login.html', 'Go back': 'signup.html',
    'Back to home': 'index.html', 'Go to home page': 'index.html', 'Go to my dashboard': 'dashboard.html',
    'Linkhaven': 'index.html',
    'Terms': 'legal.html#terms', 'Privacy': 'legal.html#privacy', 'Privacy Policy': 'legal.html#privacy',
    'Acceptable use': 'legal.html#acceptable-use', 'Report abuse': 'legal.html#report',
    'Features': 'index.html#features', 'How it works': 'index.html#how', 'Pricing': 'index.html#pricing', 'Links': 'dashboard.html', 'Appearance': 'appearance.html', 'Analytics': 'analytics.html', 'Settings': 'settings.html'
  };
  document.querySelectorAll('a').forEach(function (a) {
    var t = a.textContent.trim();
    if (links[t]) a.setAttribute('href', links[t]);
  });
  var claim = document.querySelector('.claim');
  if (claim) {
    var go = function () {
      var v = (document.getElementById('handle') || {}).value || '';
      location.href = 'signup.html' + (v ? '?handle=' + encodeURIComponent(v.trim()) : '');
    };
    var btn = claim.querySelector('button');
    if (btn) btn.addEventListener('click', go);
    var inp = document.getElementById('handle');
    if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }
  var h = new URLSearchParams(location.search).get('handle');
  var sh = document.getElementById('sh');
  if (h && sh) sh.value = h;
  if (/(appearance|analytics|settings)(\.html)?$/.test(location.pathname)) {
    var b = document.createElement('div');
    b.textContent = 'Preview: this page shows sample data. It becomes real in the next update.';
    b.style.cssText = 'background:#07281A;color:#F2F5EE;text-align:center;padding:10px 16px;font:600 14px Figtree,sans-serif';
    document.body.insertBefore(b, document.body.firstChild);
  }
})();
</script>
<script>
(function () {
  var em = LH.$('le'), pw = LH.$('lp'), go = LH.btn('Log in');
  while (go && go.tagName !== 'BUTTON') go = null;
  var btns = [].slice.call(document.querySelectorAll('button')).filter(function (b) { return b.textContent.trim() === 'Log in'; });
  go = btns[0];
  if (!em || !go) return;
  if (LH.session()) { location.replace('dashboard.html'); return; }
  function submit() {
    var email = em.value.trim(), pass = pw.value;
    if (!email || !pass) return LH.showErr(go, 'Enter your email and password.');
    LH.showErr(go, ''); go.disabled = true; go.style.opacity = '0.6'; var old = go.textContent; go.textContent = 'Logging in…';
    LH.signIn(email, pass).then(function () { location.href = 'dashboard.html'; }).catch(function (err) {
      go.disabled = false; go.style.opacity = '1'; go.textContent = old; LH.showErr(go, LH.friendly(err));
    });
  }
  go.addEventListener('click', submit);
  [em, pw].forEach(function (i) { i.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); }); });
  var g = [].slice.call(document.querySelectorAll('button')).filter(function (b) { return b.textContent.indexOf('Continue with Google') > -1; })[0];
  if (g) g.addEventListener('click', function () { LH.showErr(go, 'Google sign-in is not available yet. Use your email for now.'); });
})();
</script>
