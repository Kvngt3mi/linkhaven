<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – Linkhaven</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{opacity:.8}
.glass{background:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.95);box-shadow:0 20px 50px rgba(10,61,31,0.12);backdrop-filter:blur(14px)}
.chev{display:flex}
@media (max-width:820px){.chev{display:none}}
@media (max-width:700px){.nl{display:none}.navpill{padding-left:16px !important;gap:16px !important}}
@media (max-width:560px){.claim{flex-wrap:wrap !important;border-radius:28px !important;padding:14px !important}.claim button{width:100%;justify-content:center}.claim>svg{display:none}.stepspanel{padding:28px 22px !important}}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center; color: #07281A; font-family: 'Figtree', sans-serif; font-size: 17px; line-height: 1.5; background: radial-gradient(1000px 650px at 85% 6%, #DDF7AE 0%, rgba(221,247,174,0) 60%), #F1F6E6">
<div class="glass" style="border-radius: 32px; padding: 40px; max-width: 520px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 120px; line-height: 1; letter-spacing: -0.04em; background: linear-gradient(180deg, #2F9E2A, #0F6F2C); -webkit-background-clip: text; background-clip: text; color: transparent">404</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">This page does not exist</h1>
<p style="margin: 0; color: #3B5A45">The link may be wrong, or nobody has claimed this handle yet.</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px">
<a href="signup.html" style="background: linear-gradient(180deg, #D4FF4A, #9BE21A); box-shadow: 0 0 0 2px #7CCB12; padding: 14px 26px; border-radius: 999px; font-weight: 600">Claim this handle</a>
<a href="index.html" style="border: 2px solid #07281A; padding: 12px 24px; border-radius: 999px; font-weight: 600">Go to home page</a>
</div></div></div>
<script>
// Linkhaven prototype wiring (no backend yet). Phase 2 replaces this with real sign-up, login and saving.
(function () {
  var links = {
    'Log in': 'auth.html', 'Sign up free': 'auth.html', 'Claim your handle': 'auth.html',
    'Claim this handle': 'auth.html', 'Join Linkhaven Today': 'auth.html', 'Get Started': 'auth.html',
    'Back to log in': 'auth.html', 'Go back': 'auth.html', 'Go to home page': 'index.html',
    'Go to my dashboard': 'dashboard.html', 'Linkhaven': 'index.html',
    'Terms': 'legal.html#terms', 'Privacy': 'legal.html#privacy', 'Privacy Policy': 'legal.html#privacy',
    'Acceptable use': 'legal.html#acceptable-use', 'Report abuse': 'legal.html#report',
    'Links': 'dashboard.html', 'Appearance': 'appearance.html', 'Analytics': 'analytics.html', 'Settings': 'settings.html'
  };
  document.querySelectorAll('a').forEach(function (a) {
    var t = a.textContent.trim();
    if (links[t]) a.setAttribute('href', links[t]);
  });
  var buttons = { 'Create my page': 'onboarding.html', 'Log in': 'dashboard.html', 'Finish and see my page': 'onboarding.html' };
  document.querySelectorAll('button').forEach(function (b) {
    var t = b.textContent.trim();
    if (buttons[t]) b.addEventListener('click', function () { location.href = buttons[t]; });
  });
  // Home page: send the typed handle to sign-up
  var claim = document.querySelector('.claim');
  if (claim) {
    var go = function () {
      var v = (document.getElementById('handle') || {}).value || '';
      location.href = 'auth.html' + (v ? '?handle=' + encodeURIComponent(v.trim()) : '');
    };
    var btn = claim.querySelector('button');
    if (btn) btn.addEventListener('click', go);
    var inp = document.getElementById('handle');
    if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }
  // Sign-up: prefill handle from the home page
  var h = new URLSearchParams(location.search).get('handle');
  var sh = document.getElementById('sh');
  if (h && sh) sh.value = h;
})();
</script>
</body>
</html>
