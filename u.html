<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Linkhaven</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{opacity:.8}
.glass{background:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.95);box-shadow:0 20px 50px rgba(10,61,31,0.12);backdrop-filter:blur(14px)}
.chev{display:flex}
@media (max-width:820px){.chev{display:none}}
@media (max-width:700px){.nl{display:none}.navpill{padding-left:16px !important;gap:16px !important}}
@media (max-width:560px){.claim{flex-wrap:wrap !important;border-radius:28px !important;padding:14px !important}.claim button{width:100%;justify-content:center}.claim>svg{display:none}.stepspanel{padding:28px 22px !important}}
</style>
</head>
<body>
<div id="root" style="min-height: 100vh; box-sizing: border-box; padding: 32px 20px; display: flex; justify-content: center; font-family: 'Figtree', sans-serif; font-size: 17px; line-height: 1.5; background: #F1F6E6; color: #07281A"><div id="app" style="width: 100%; max-width: 440px"><div style="text-align: center; padding: 80px 0; color: #3B5A45">Loading…</div></div></div>
<script>
// Linkhaven core: talks to Supabase using plain fetch. The key below is the public (publishable) key.
(function () {
  var LH = window.LH = {};
  LH.url = 'https://vjpnaxulswqrogjlknls.supabase.co';
  LH.key = 'sb_publishable_hR7ZtlFR__pr7HOODN-blQ_XLYB0Cr0';
  var SKEY = 'lh_session';

  LH.$ = function (id) { return document.getElementById(id); };
  LH.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  LH.btn = function (text) {
    return [].slice.call(document.querySelectorAll('button,a')).filter(function (b) { return b.textContent.trim() === text; })[0] || null;
  };
  LH.leaf = function (text) {
    return [].slice.call(document.querySelectorAll('div,span,b')).filter(function (d) { return d.children.length === 0 && d.textContent.trim() === text; });
  };
  LH.replaceText = function (root, from, to) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) { if (n.nodeValue.indexOf(from) > -1) n.nodeValue = n.nodeValue.split(from).join(to); }
  };

  // ---- session ----
  LH.session = function () { try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { return null; } };
  LH.save = function (s) {
    if (!s) { localStorage.removeItem(SKEY); return; }
    var exp = s.expires_at || (s.expires_in ? Math.floor(Date.now() / 1000) + s.expires_in : 0);
    localStorage.setItem(SKEY, JSON.stringify({
      access_token: s.access_token, refresh_token: s.refresh_token, expires_at: exp,
      user: s.user ? { id: s.user.id, email: s.user.email } : (LH.session() || {}).user
    }));
  };

  // ---- errors ----
  LH.msg = function (j) { return (j && (j.msg || j.error_description || j.message || j.error)) || ''; };
  LH.friendly = function (e) {
    var m = ((e && e.message) || '').toLowerCase();
    if (m.indexOf('already registered') > -1 || m.indexOf('already exists') > -1) return 'That email already has an account. Try logging in.';
    if (m.indexOf('invalid login') > -1) return 'Wrong email or password.';
    if (m.indexOf('not confirmed') > -1) return 'Please confirm your email first. Check your inbox.';
    if (m.indexOf('password') > -1 && m.indexOf('at least') > -1) return 'Use at least 8 characters for your password.';
    if (m.indexOf('database error') > -1) return 'That handle may have just been taken. Try another one.';
    if (m.indexOf('rate limit') > -1 || (e && e.status === 429)) return 'Too many attempts. Please wait a few minutes and try again.';
    if (m.indexOf('failed to fetch') > -1 || m.indexOf('network') > -1) return 'No connection. Check your internet and try again.';
    return (e && e.message) || 'Something went wrong. Please try again.';
  };
  LH.showErr = function (before, text, good) {
    var d = before.previousElementSibling;
    if (!d || !d.classList || !d.classList.contains('lh-msg')) {
      d = document.createElement('div'); d.className = 'lh-msg';
      d.style.cssText = 'font-size:15px;font-weight:600;line-height:1.4';
      before.parentNode.insertBefore(d, before);
    }
    d.style.color = good ? '#1E7A32' : '#C23A22';
    d.textContent = text || '';
    d.style.display = text ? 'block' : 'none';
  };

  // ---- network ----
  LH.headers = function (token, extra) {
    var h = { 'apikey': LH.key, 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    for (var k in (extra || {})) h[k] = extra[k];
    return h;
  };
  function jfetch(path, opts) {
    return fetch(LH.url + path, opts).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) { var err = new Error(LH.msg(j) || ('Request failed (' + r.status + ')')); err.status = r.status; err.body = j; throw err; }
        return { body: j, res: r };
      });
    });
  }
  LH.token = function () {
    var s = LH.session();
    if (!s) return Promise.resolve(null);
    if (s.expires_at && s.expires_at - 60 > Math.floor(Date.now() / 1000)) return Promise.resolve(s.access_token);
    return jfetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ refresh_token: s.refresh_token }) })
      .then(function (r) { LH.save(r.body); return r.body.access_token; })
      .catch(function () { LH.save(null); return null; });
  };
  // method, path (after /rest/v1/), JSON body, optional Prefer header
  LH.rest = function (method, path, body, prefer) {
    return LH.token().then(function (t) {
      return jfetch('/rest/v1/' + path, { method: method, headers: LH.headers(t, prefer ? { Prefer: prefer } : null), body: body === undefined ? undefined : JSON.stringify(body) });
    }).then(function (r) { return r.body; });
  };
  LH.count = function (path) {
    return LH.token().then(function (t) {
      return fetch(LH.url + '/rest/v1/' + path, { headers: LH.headers(t, { Prefer: 'count=exact', Range: '0-0' }) }).then(function (r) {
        var n = parseInt((r.headers.get('content-range') || '').split('/')[1], 10);
        return isNaN(n) ? 0 : n;
      });
    });
  };

  // ---- auth ----
  LH.signUp = function (email, pw, handle) {
    return jfetch('/auth/v1/signup', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ email: email, password: pw, data: { handle: handle } }) })
      .then(function (r) { if (r.body && r.body.access_token) { LH.save(r.body); return { session: true }; } return { session: false }; });
  };
  LH.signIn = function (email, pw) {
    return jfetch('/auth/v1/token?grant_type=password', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ email: email, password: pw }) })
      .then(function (r) { LH.save(r.body); return r.body; });
  };
  LH.signOut = function () {
    return LH.token().then(function (t) {
      LH.save(null);
      if (!t) return;
      return fetch(LH.url + '/auth/v1/logout', { method: 'POST', headers: LH.headers(t) }).catch(function () {});
    });
  };
  LH.recover = function (email) { return jfetch('/auth/v1/recover', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ email: email }) }); };
  LH.resend = function (email) { return jfetch('/auth/v1/resend', { method: 'POST', headers: LH.headers(), body: JSON.stringify({ type: 'signup', email: email }) }); };
  LH.setPassword = function (token, pw) { return jfetch('/auth/v1/user', { method: 'PUT', headers: LH.headers(token), body: JSON.stringify({ password: pw }) }); };

  // ---- storage ----
  LH.uploadAvatar = function (blob, uid) {
    return LH.token().then(function (t) {
      var path = uid + '/avatar.jpg';
      return fetch(LH.url + '/storage/v1/object/avatars/' + path, { method: 'POST', headers: { apikey: LH.key, Authorization: 'Bearer ' + t, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: blob })
        .then(function (r) { if (!r.ok) throw new Error('Photo upload failed. Try a smaller picture.'); return LH.url + '/storage/v1/object/public/avatars/' + path + '?v=' + Date.now(); });
    });
  };
  LH.resize = function (file, max) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { URL.revokeObjectURL(u); b ? resolve(b) : reject(new Error('Could not read that picture.')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { reject(new Error('Could not read that picture.')); };
      img.src = u;
    });
  };

  // ---- helpers ----
  LH.reserved = ['admin','api','app','auth','dashboard','login','logout','signup','settings','appearance','analytics','legal','terms','privacy','report','support','help','about','pricing','feedback','assets','static','www','linkhaven','index','onboarding','forgot-password','check-email','profile'];
  LH.checkHandle = function (v) {
    if (!/^[a-z0-9_.]{3,30}$/.test(v)) return 'Use 3 to 30 letters, numbers, dots or underscores.';
    if (LH.reserved.indexOf(v) > -1) return 'That name is reserved. Try another one.';
    return '';
  };
  LH.normUrl = function (u) {
    u = (u || '').trim();
    if (!u) return '';
    if (!/^(https?:\/\/|mailto:|tel:)/i.test(u)) u = (u.indexOf('@') > 0 && !/[\/\s]/.test(u)) ? 'mailto:' + u : 'https://' + u;
    if (/^https?:/i.test(u)) { try { new URL(u); } catch (e) { return ''; } }
    return u.length > 2000 ? '' : u;
  };
  LH.device = function () {
    var ua = navigator.userAgent || '';
    if (/iPad|Tablet/i.test(ua)) return 'tablet';
    if (/Mobi|Android|iPhone/i.test(ua)) return 'mobile';
    return ua ? 'desktop' : 'unknown';
  };
  LH.pageUrl = function (handle) { return location.origin + '/u.html?h=' + encodeURIComponent(handle); };
  LH.copy = function (text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove();
    return Promise.resolve();
  };
  // Show / Hide buttons next to password fields
  document.querySelectorAll('button').forEach(function (b) {
    if (b.textContent.trim() === 'Show') b.addEventListener('click', function () {
      var i = b.parentElement.querySelector('input'); if (!i) return;
      var show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
    });
  });
  // Password reset links land on the home page with a token in the address: forward them
  if (/type=recovery/.test(location.hash) && !/reset-password/.test(location.pathname)) location.replace('reset-password.html' + location.hash);
})();
</script>
<script>
(function () {
  var app = LH.$('app'), root = LH.$('root');
  var h = (new URLSearchParams(location.search).get('h') || '').toLowerCase();
  var T = {
    'lime-glow': { bg: 'linear-gradient(165deg,#E3FF6A 0%,#A7E61C 45%,#3FA832 100%)', tx: '#07281A', btn: '#F4F1E4', bt: '#07281A', bd: 'none', sh: '0 6px 14px rgba(7,40,26,0.18)', av: 'radial-gradient(circle at 35% 30%,#F2FF8A,#A7E61C)', ab: '#07281A', soc: 'rgba(255,255,255,0.55)' },
    'midnight': { bg: 'radial-gradient(520px 340px at 50% 0%,#1C7A3A 0%,rgba(28,122,58,0) 70%),#07281A', tx: '#F2F5EE', btn: 'rgba(255,255,255,0.08)', bt: '#F2F5EE', bd: '1px solid rgba(255,255,255,0.22)', sh: 'none', av: 'radial-gradient(circle at 35% 30%,#F2FF8A,#A7E61C)', ab: '#B2F11B', soc: 'rgba(255,255,255,0.10)' },
    'coral': { bg: 'linear-gradient(165deg,#FF9A7A 0%,#FF6B4A 50%,#E8543A 100%)', tx: '#07281A', btn: '#FFFFFF', bt: '#07281A', bd: 'none', sh: '0 6px 14px rgba(120,30,10,0.22)', av: 'radial-gradient(circle at 35% 30%,#FFF3C4,#FFC93C)', ab: '#07281A', soc: 'rgba(255,255,255,0.55)' },
    'paper': { bg: '#F4F1E4', tx: '#07281A', btn: '#FFFFFF', bt: '#07281A', bd: '1px solid #C9C3AE', sh: 'none', av: 'radial-gradient(circle at 35% 30%,#F2FF8A,#A7E61C)', ab: '#07281A', soc: 'rgba(7,40,26,0.08)' },
    'ocean': { bg: 'linear-gradient(165deg,#1D8FB8,#0E4A7A)', tx: '#FFFFFF', btn: 'rgba(255,255,255,0.18)', bt: '#FFFFFF', bd: '1px solid rgba(255,255,255,0.35)', sh: 'none', av: 'radial-gradient(circle at 35% 30%,#BDEBFF,#5CC0E6)', ab: '#FFFFFF', soc: 'rgba(255,255,255,0.18)' },
    'sunset': { bg: 'linear-gradient(165deg,#FFB347,#FF5E62)', tx: '#07281A', btn: '#FFFFFF', bt: '#07281A', bd: 'none', sh: '0 6px 14px rgba(120,30,10,0.22)', av: 'radial-gradient(circle at 35% 30%,#FFF3C4,#FFC93C)', ab: '#07281A', soc: 'rgba(255,255,255,0.55)' }
  };
  function el(tag, css, text, attrs) {
    var e = document.createElement(tag); if (css) e.style.cssText = css; if (text != null) e.textContent = text;
    for (var k in (attrs || {})) e.setAttribute(k, attrs[k]);
    return e;
  }
  function notFound(msg) {
    document.title = 'Page not found – Linkhaven';
    app.innerHTML = '';
    var c = el('div', 'background:rgba(255,255,255,0.7);border-radius:32px;padding:40px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;color:#07281A');
    c.appendChild(el('div', "font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:96px;line-height:1;color:#0F6F2C", '404'));
    c.appendChild(el('div', "font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px", 'This page does not exist'));
    c.appendChild(el('div', 'color:#3B5A45', msg || 'The link may be wrong, or nobody has claimed this handle yet.'));
    var a = el('a', 'margin-top:8px;background:linear-gradient(180deg,#D4FF4A,#9BE21A);box-shadow:0 0 0 2px #7CCB12;padding:14px 26px;border-radius:999px;font-weight:600;color:#07281A;text-decoration:none', 'Claim this handle', { href: 'signup.html' + (h ? '?handle=' + encodeURIComponent(h) : '') });
    c.appendChild(a); app.appendChild(c);
  }
  if (!h) return notFound();
  var S = LH.session();
  LH.rest('GET', 'profiles?handle=eq.' + encodeURIComponent(h) + '&select=*').then(function (a) {
    if (!a.length) return notFound();
    var p = a[0];
    return LH.rest('GET', 'links?user_id=eq.' + p.id + '&is_active=eq.true&order=position.asc,created_at.asc').then(function (ls) { render(p, ls); track(p); });
  }).catch(function () { notFound('We could not load this page. Please try again.'); });

  function render(p, ls) {
    var t = T[p.theme] || T['lime-glow'], name = p.display_name || p.handle;
    document.title = name + ' – Linkhaven';
    root.style.background = t.bg; root.style.color = t.tx;
    app.innerHTML = '';
    var col = el('div', 'display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 0');
    var av = el('div', "width:96px;height:96px;border-radius:50%;background:" + t.av + ";border:3px solid " + t.ab + ";display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:42px;color:#07281A;background-size:cover;background-position:center;overflow:hidden", p.avatar_url ? '' : (name[0] || 'Y').toUpperCase());
    if (p.avatar_url) av.style.backgroundImage = 'url("' + p.avatar_url.replace(/"/g, '%22') + '")';
    col.appendChild(av);
    var tb = el('div', 'text-align:center');
    tb.appendChild(el('div', "font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;line-height:1.15", name));
    tb.appendChild(el('div', 'font-size:15px;opacity:0.85;margin-top:2px', '@' + p.handle));
    if (p.bio) tb.appendChild(el('div', 'font-size:16px;margin-top:8px;white-space:pre-line', p.bio));
    col.appendChild(tb);
    ls.forEach(function (l) {
      if (!/^(https?:|mailto:|tel:)/i.test(l.url)) return;
      var a = el('a', 'width:100%;box-sizing:border-box;text-align:center;padding:16px 20px;border-radius:999px;background:' + t.btn + ';color:' + t.bt + ';border:' + t.bd + ';box-shadow:' + t.sh + ';font-weight:600;font-size:16px;text-decoration:none', l.title, { href: l.url, target: '_blank', rel: 'noopener noreferrer nofollow' });
      a.addEventListener('click', function () { click(l, p); });
      col.appendChild(a);
    });
    if (!ls.length) col.appendChild(el('div', 'opacity:0.8;margin-top:12px', 'No links yet.'));
    var f = el('div', 'margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:6px');
    f.appendChild(el('a', 'padding:8px 18px;border-radius:999px;background:' + t.soc + ';font-size:13px;font-weight:600;color:' + t.tx + ';text-decoration:none', 'Made with Linkhaven', { href: 'index.html' }));
    f.appendChild(el('a', 'font-size:12px;opacity:0.75;text-decoration:underline;color:' + t.tx, 'Report this page', { href: 'legal.html?report=' + encodeURIComponent(p.handle) + '#report' }));
    col.appendChild(f); app.appendChild(col);
  }
  function owner(p) { return S && S.user && S.user.id === p.id; }
  function post(path, body) {
    return fetch(LH.url + '/rest/v1/' + path, { method: 'POST', keepalive: true, headers: LH.headers(null), body: JSON.stringify(body) }).catch(function () {});
  }
  function track(p) {
    if (owner(p)) return;
    post('page_views', { profile_id: p.id, referrer: (document.referrer || '').slice(0, 500) || null, device: LH.device() });
  }
  function click(l, p) {
    if (owner(p)) return;
    post('link_clicks', { link_id: l.id, referrer: (document.referrer || '').slice(0, 500) || null, device: LH.device() });
  }
})();
</script>
</body>
